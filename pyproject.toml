[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-cosmos"
version = "2.0.0"
description = "Atlas do Cosmos: simulação didática do Sistema Solar, da Via Láctea e do Universo com dados da NASA (FastAPI + Vue 3 + Three.js)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pedro" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "ruff>=0.6",
    "invoke>=2.2",
]
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[project.scripts]
atlas = "atlas.ext.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
"atlas.catalog" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Aviso interno do TestClient do Starlette 1.x; não afeta o projeto.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]  # comprimento de linha fica a cargo do `ruff format`
